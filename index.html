<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c3a1d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tournament Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="share-btn icon-btn" id="copyLink" aria-label="Copy link to current state" title="Copy link to current state (L)">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.4-3.4a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zM8.1 19.9a4.6 4.6 0 0 1-3.2-7.9l2.2-2.2a1 1 0 1 1 1.4 1.4l-2.2 2.2a2.6 2.6 0 0 0 3.7 3.7l2.2-2.2a1 1 0 1 1 1.4 1.4l-2.2 2.2a4.6 4.6 0 0 1-3.3 1.4zm8.8-5.7a1 1 0 0 1-.7-1.7l2.2-2.2a2.6 2.6 0 0 0-3.7-3.7l-2.2 2.2a1 1 0 1 1-1.4-1.4l2.2-2.2a4.6 4.6 0 0 1 6.5 6.5l-2.2 2.2a1 1 0 0 1-.7.3z"/></svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <main class="board">
    <div class="level" id="level">Level 1</div>

    <div class="timer" id="timer">20:00</div>
    <div class="seek" id="seek" role="slider" tabindex="0"
         aria-label="Time elapsed in level" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"
         title="Click or drag to adjust the time">
      <div class="progress"><div class="progress-bar" id="progress"></div></div>
      <div class="seek-thumb"></div>
    </div>

    <div class="blinds">
      <div class="blind">
        <div class="blind-label">Small Blind</div>
        <div class="blind-value" id="sb">100</div>
      </div>
      <div class="blind-sep">/</div>
      <div class="blind">
        <div class="blind-label">Big Blind</div>
        <div class="blind-value" id="bb">200</div>
      </div>
    </div>

    <div class="next" id="next">Next: 200 / 400</div>

    <div class="controls">
      <button id="prev" title="Restart level · press again to go to previous level (←)" aria-label="Restart level or go to previous level">&#9664;&#9664;</button>
      <button id="toggle" class="primary icon-btn" aria-label="Start" title="Start (Space)">
        <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.52.85l12.2-7.5a1 1 0 0 0 0-1.7L8.52 3.65A1 1 0 0 0 7 4.5z"/></svg>
        <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4" width="4.5" height="16" rx="1"/><rect x="14" y="4" width="4.5" height="16" rx="1"/></svg>
      </button>
      <button id="nextBtn" title="Next level (→)">&#9654;&#9654;</button>
    </div>
  </main>

  <aside class="panel" id="panel" aria-label="Blind structure editor">
    <button class="panel-toggle" id="panelToggle" aria-expanded="false" aria-controls="panel" title="Blind structure (S)">
      <span class="panel-toggle-icon">&#9664;</span>
      <span class="panel-toggle-text">Structure</span>
    </button>

    <div class="panel-body">
      <div class="panel-header">
        <h2>Blind Structure</h2>
        <button class="panel-close" id="panelClose" aria-label="Close structure panel" title="Close (Esc)">&#10005;</button>
      </div>

      <section class="panel-saved">
        <h3 class="first">Saved Structures</h3>

        <div class="panel-row">
          <input type="text" id="saveName" placeholder="Structure name" maxlength="60" aria-label="Structure name">
          <button id="saveStructure">Save</button>
        </div>

        <div class="panel-row saved-row">
          <select id="savedList" aria-label="Saved structures"></select>
          <button id="loadSaved">Load</button>
          <button id="deleteSaved">Delete</button>
        </div>
      </section>

      <section class="panel-levels">
        <div class="levels-header">
          <h3>Levels</h3>
          <button id="newStructure" class="small-btn" title="Start an empty structure">New structure</button>
        </div>

        <div class="structure-head">
          <span>#</span><span title="Small blind">SB</span><span title="Big blind">BB</span><span title="Level length in minutes">Time</span><span></span>
        </div>
        <ol class="structure-list" id="structureList"></ol>
        <p class="structure-empty" id="structureEmpty">No levels yet. Add a level or break below.</p>

        <div class="panel-row">
          <button id="addLevel">+ Level</button>
          <button id="addBreak">+ Break</button>
        </div>
      </section>

      <div class="panel-footer">
        <p class="panel-error" id="panelError" role="alert"></p>

        <div class="panel-row">
          <button id="applyStructure" class="primary">Apply</button>
          <button id="defaultStructure">Load Default</button>
        </div>
      </div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
